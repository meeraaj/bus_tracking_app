apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-tracker-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-tracker
  template:
    metadata:
      labels:
        app: bus-tracker
    spec:
      containers:
        - name: server
          image: bus-tracking-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              value: "campus-super-secure-jwt-key-2026-xyz"
            - name: DRIVER_PIN_85
              value: "8585"
            - name: DRIVER_PIN_DEFAULT
              value: "1234"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bus-tracker-service
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: bus-tracker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bus-tracker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bus-tracker-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
