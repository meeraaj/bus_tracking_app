apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-tracker-backend
  labels:
    app: bus-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-tracker
  template:
    metadata:
      labels:
        app: bus-tracker
    spec:
      containers:
        - name: server
          image: ghcr.io/meeraaj/bus-tracking-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: JWT_SECRET
              value: "campus-super-secure-jwt-key-2026-xyz"
            - name: DRIVER_PIN_85
              value: "8585"
            - name: DRIVER_PIN_DEFAULT
              value: "1234"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: bus-tracker-service
  labels:
    app: bus-tracker
spec:
  type: LoadBalancer # In k3s, Klipper LB maps this directly to the VM's external IP on port 80/8080
  ports:
    - port: 80
      targetPort: 8080
      name: http
    - port: 8080
      targetPort: 8080
      name: direct
  selector:
    app: bus-tracker
