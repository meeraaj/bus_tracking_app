app = "campus-bustracker-go"
primary_region = "maa" # Chennai, India for lowest latency to Tambaram/Selaiyur

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DRIVER_PIN_85 = "8585"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/healthz"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
