# Google Cloud Build + Cloud Run Continuous Deployment
steps:
  # 1. Build the Go WebSocket backend Docker image from /backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/campus-bustracker-go:$COMMIT_SHA'
      - './backend'

  # 2. Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/campus-bustracker-go:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run (asia-south1 Mumbai for lowest latency in India)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'campus-bustracker-go'
      - '--image=gcr.io/$PROJECT_ID/campus-bustracker-go:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--timeout=3600'
      - '--session-affinity'
      - '--min-instances=1'
      - '--max-instances=1'
      - '--set-env-vars=DRIVER_PIN_85=8585,DRIVER_PIN_DEFAULT=1234'

images:
  - 'gcr.io/$PROJECT_ID/campus-bustracker-go:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
