services:
  - type: web
    name: campus-bustracker-go
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: DRIVER_PIN_85
        value: "8585"
      - key: DRIVER_PIN_DEFAULT
        value: "1234"
